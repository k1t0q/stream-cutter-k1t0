name: Build STREAM CUTTER Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Patch client startup/progress adapter
        shell: pwsh
        run: |
          $p = 'stream_cutter.py'
          $s = Get-Content $p -Raw -Encoding UTF8
          $old = "    def __init__(self, bar):`r`n        self.bar=bar"
          $new = "    def __init__(self, bar, owner=None):`r`n        self.bar=bar`r`n        self.widget=bar`r`n        self.owner=owner"
          if (-not $s.Contains($old)) {
            $old = "    def __init__(self, bar):`n        self.bar=bar"
            $new = "    def __init__(self, bar, owner=None):`n        self.bar=bar`n        self.widget=bar`n        self.owner=owner"
          }
          if (-not $s.Contains($old)) { throw 'ProgressAdapter signature not found' }
          $s = $s.Replace($old,$new)
          $s = $s.Replace('progress_pct','progress_text')
          Set-Content $p $s -Encoding UTF8
          python -m py_compile stream_cutter.py
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-exe.txt
          pip install pyinstaller
      - name: Download yt-dlp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "runtime/yt-dlp.exe"
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $ffmpeg=(Get-Command ffmpeg.exe).Source
          $ffprobe=(Get-Command ffprobe.exe).Source
          Copy-Item $ffmpeg runtime/ffmpeg.exe -Force
          Copy-Item $ffprobe runtime/ffprobe.exe -Force
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean stream_cutter.spec
          Copy-Item runtime "dist/STREAM CUTTER k1t0/runtime" -Recurse -Force
      - name: Smoke test files
        shell: pwsh
        run: |
          $exe="dist/STREAM CUTTER k1t0/STREAM CUTTER k1t0.exe"
          if (!(Test-Path $exe)) { throw "EXE not created" }
          if (!(Test-Path "dist/STREAM CUTTER k1t0/runtime/yt-dlp.exe")) { throw "yt-dlp missing" }
          if (!(Test-Path "dist/STREAM CUTTER k1t0/runtime/ffmpeg.exe")) { throw "ffmpeg missing" }
      - name: ZIP client build
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/STREAM CUTTER k1t0/*" -DestinationPath "STREAM_CUTTER_k1t0_CLIENT_WINDOWS.zip" -CompressionLevel Optimal
      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: STREAM_CUTTER_k1t0_CLIENT_WINDOWS
          path: STREAM_CUTTER_k1t0_CLIENT_WINDOWS.zip
          if-no-files-found: error
          retention-days: 30
